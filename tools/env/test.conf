# ============================================================
# 测试环境配置（T6，本文件被 git 追踪；仅含测试库口令）
# ------------------------------------------------------------
# 体系：tools/env/ 三份文件 + active.conf 当前生效
#   test.conf        测试库连接（追踪）
#   prod.conf        生产库连接（.gitignore 排除，仓库只放 prod.conf.example）
#   active.conf      当前生效 = 复制自 test/prod（.gitignore 排除）
# 切换（tools/tv.py）：
#   tv.py env test|prod        复制模板覆盖 active.conf（持久切换）
#   tv.py --env test|prod <子> 一次性临时覆盖（不写盘）
# 优先级：环境变量 DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME > 本文件。
# BASE_URL 仅供 tv.py 帮助/横幅展示参考；run_tests/conftest 以自身 18080 常量为准。
# ============================================================

DB_HOST=127.0.0.1
DB_PORT=3307
DB_USER=root
DB_PASSWORD=ROOT123
DB_NAME=TVDatabase_test

BASE_URL=http://127.0.0.1:18080