<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>媒体资源运维</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #18191c; padding: 16px; }
        .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .top h1 { font-size: 18px; }
        .btn { border: 1px solid #d0d3d8; background: #fff; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
        .btn.primary { background: #fb7299; border-color: #fb7299; color: #fff; }
        .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .stat { background: #fff; border-radius: 8px; padding: 10px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 13px; }
        .stat b { font-size: 20px; display: block; }
        .stat.missing b { color: #e34d59; }
        .stat.ok b { color: #2ba245; }
        .toolbar { margin-bottom: 10px; }
        .toolbar select, .toolbar input { padding: 6px 10px; border: 1px solid #d0d3d8; border-radius: 6px; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        th, td { border-bottom: 1px solid #eef0f2; padding: 8px 10px; font-size: 13px; text-align: left; vertical-align: top; }
        th { background: #fafbfc; color: #61666d; font-weight: 600; white-space: nowrap; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .tag.ok { background: #e6f7ec; color: #2ba245; }
        .tag.missing { background: #fdecee; color: #e34d59; }
        .tag.invalid { background: #fff4e5; color: #c07a14; }
        .url { word-break: break-all; color: #61666d; }
        .path { word-break: break-all; color: #9499a0; font-size: 12px; }
        .restore-form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .restore-form input[type=file] { font-size: 12px; max-width: 160px; }
        .msg { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 9px 18px; border-radius: 18px; font-size: 13px; z-index: 99; }
        .empty { padding: 40px; text-align: center; color: #9499a0; }
        @media (max-width: 700px) { table { font-size: 12px; } .restore-form { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>

<div class="top">
    <h1>🔧 媒体资源运维</h1>
    <button class="btn primary" onclick="scan()">重新扫描</button>
</div>

<div class="stats" id="stats"></div>

<div class="toolbar">
    <select id="filter" onchange="render()">
        <option value="all">全部</option>
        <option value="missing" selected>仅缺失/异常</option>
        <option value="exists">仅存在</option>
    </select>
</div>

<table>
    <thead>
    <tr>
        <th>mediaId</th>
        <th>contentId</th>
        <th>标题</th>
        <th>类型</th>
        <th>状态</th>
        <th>URL</th>
        <th>期望路径</th>
        <th>最近校验</th>
        <th>恢复</th>
    </tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>

<script>
const token = localStorage.getItem('userToken');
let result = null;

init();

async function init() {
    if (!token) {
        alert('请先登录');
        window.location.href = 'login.html';
        return;
    }
    if (await checkAdmin()) {
        await loadList();
    }
}

async function checkAdmin() {
    try {
        const data = await request('./api/admin/media/me');
        if (data.data === true) return true;
        renderNoPermission();
        return false;
    } catch (e) {
        if (e.message === 'unauthorized') return false;
        if (e.message === 'forbidden') {
            renderNoPermission();
            return false;
        }
        showMsg(e.message || '权限检查失败');
        renderNoPermission();
        return false;
    }
}

function renderNoPermission() {
    const scanBtn = document.querySelector('.top .btn.primary');
    if (scanBtn) scanBtn.style.display = 'none';
    const toolbar = document.querySelector('.toolbar');
    if (toolbar) toolbar.style.display = 'none';
    const thead = document.querySelector('table thead');
    if (thead) thead.style.display = 'none';
    document.getElementById('stats').innerHTML = '';
    document.getElementById('tbody').innerHTML =
        '<tr><td colspan="9" class="empty">无权限访问：该页面仅管理员可用</td></tr>';
}

async function request(url, options = {}) {
    options.headers = options.headers || {};
    if (token) options.headers['token'] = token;
    const res = await fetch(url, options);
    if (res.status === 401) {
        localStorage.removeItem('userToken');
        localStorage.removeItem('username');
        alert('登录已过期，请重新登录');
        window.location.href = 'login.html';
        throw new Error('unauthorized');
    }
    if (res.status === 403) {
        throw new Error('forbidden');
    }
    const data = await res.json();
    if (data.code !== 200) throw new Error(data.msg || '请求失败');
    return data;
}

async function loadList() {
    try {
        const data = await request('./api/admin/media/list');
        result = data.data;
        renderStats();
        render();
    } catch (e) {
        if (e.message !== 'unauthorized') showMsg(e.message || '加载失败');
    }
}

async function scan() {
    try {
        showMsg('扫描中...');
        const data = await request('./api/admin/media/scan', { method: 'POST' });
        result = data.data;
        renderStats();
        render();
        showMsg('扫描完成');
    } catch (e) {
        if (e.message !== 'unauthorized') showMsg(e.message || '扫描失败');
    }
}

function renderStats() {
    if (!result) return;
    const s = result;
    document.getElementById('stats').innerHTML =
        `<div class="stat"><b>${s.total}</b>总数</div>` +
        `<div class="stat ok"><b>${s.existing}</b>存在</div>` +
        `<div class="stat missing"><b>${s.missing}</b>缺失</div>` +
        `<div class="stat"><b>${s.invalid}</b>URL异常</div>` +
        `<div class="stat"><b>${(s.orphanMediaIds || []).length}</b>孤儿media</div>` +
        `<div class="stat"><b>${(s.contentsWithoutMedia || []).length}</b>无媒体内容</div>`;
}

function typeName(t) {
    return t === 1 ? '视频' : t === 2 ? '图片' : t === 3 ? '封面' : '未知';
}

function statusTag(item) {
    if (item.status === 'EXISTS') return '<span class="tag ok">存在</span>';
    if (item.status === 'MISSING') return '<span class="tag missing">缺失</span>';
    return '<span class="tag invalid">URL异常</span>';
}

function render() {
    if (!result) return;
    const filter = document.getElementById('filter').value;
    const items = (result.items || []).filter(item => {
        if (filter === 'all') return true;
        if (filter === 'exists') return item.status === 'EXISTS';
        return item.status !== 'EXISTS';
    });
    const tbody = document.getElementById('tbody');
    if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">没有符合条件的资源</td></tr>';
        return;
    }
    tbody.innerHTML = items.map(item => `
        <tr>
            <td>${item.mediaId}</td>
            <td>${item.contentId}</td>
            <td>${escapeHtml(item.contentTitle || '(孤儿/已删除)')}</td>
            <td>${typeName(item.type)}</td>
            <td>${statusTag(item)}</td>
            <td class="url">${escapeHtml(item.url)}</td>
            <td class="path">${escapeHtml(item.expectedPath || '-')}</td>
            <td>${item.lastVerifyTime ? escapeHtml(String(item.lastVerifyTime)) : '-'}</td>
            <td>
                <form class="restore-form" onsubmit="restore(event, ${item.mediaId})">
                    <input type="file" name="file" required>
                    <button class="btn" type="submit">恢复</button>
                </form>
            </td>
        </tr>
    `).join('');
}

async function restore(event, mediaId) {
    event.preventDefault();
    const form = event.target;
    const fileInput = form.querySelector('input[type=file]');
    if (!fileInput.files || fileInput.files.length === 0) return;
    const fd = new FormData();
    fd.append('mediaId', mediaId);
    fd.append('file', fileInput.files[0]);
    try {
        showMsg('上传中...');
        const data = await request('./api/admin/media/restore', { method: 'POST', body: fd });
        showMsg(`恢复成功：${data.data.targetPath}`);
        await loadList();
    } catch (e) {
        if (e.message !== 'unauthorized') showMsg(e.message || '恢复失败');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

let msgTimer = null;
function showMsg(text) {
    const old = document.querySelector('.msg');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'msg';
    el.textContent = text;
    document.body.appendChild(el);
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => el.remove(), 2500);
}
</script>
</body>
</html>
