<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>详情</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #18191c; min-height: 100vh; }

        /* 顶部导航 */
        .top-bar { position: sticky; top: 0; z-index: 10; background: #fff; padding: 0 16px; height: 48px; display: flex; align-items: center; border-bottom: 1px solid #e3e5e7; gap: 12px; }
        .top-bar .back { font-size: 20px; cursor: pointer; color: #18191c; text-decoration: none; line-height: 1; }
        .top-bar .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 主体 */
        .main { max-width: 800px; margin: 0 auto; padding-bottom: 80px; }

        /* 媒体区 */
        .media { background: #000; text-align: center; }
        .media video { width: 100%; max-height: 450px; display: block; }
        .media .cover { width: 100%; max-height: 450px; object-fit: contain; display: block; }
        .gallery { display: flex; overflow-x: auto; gap: 8px; padding: 12px; background: #fff; }
        .gallery img { height: 180px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }

        /* 信息区 */
        .info { background: #fff; padding: 16px; margin-bottom: 10px; }
        .info .content-title { font-size: 18px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; }
        .stats { display: flex; gap: 20px; margin-bottom: 14px; font-size: 14px; color: #9499a0; }
        .stats span { cursor: default; }

        /* 作者行 */
        .author-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid #f0f0f0; }
        .author-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .author-avatar { width: 40px; height: 40px; border-radius: 50%; background: #fb7299; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; flex-shrink: 0; }
        .author-name { font-size: 15px; font-weight: 600; }
        .follow-btn { padding: 6px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid #fb7299; transition: all 0.2s; }
        .follow-btn.unfollowed { background: #fb7299; color: #fff; }
        .follow-btn.followed { background: #fff; color: #fb7299; }
        .follow-btn:active { transform: scale(0.95); }

        /* 描述 */
        .desc { font-size: 14px; line-height: 1.6; color: #61666d; margin-top: 10px; white-space: pre-wrap; }

        /* 操作按钮 */
        .actions { display: flex; gap: 12px; margin-top: 12px; }
        .like-btn { display: flex; align-items: center; gap: 6px; padding: 8px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; border: 1px solid #e3e5e7; background: #fff; transition: all 0.2s; }
        .like-btn.liked { background: #fff0f3; border-color: #fb7299; color: #fb7299; }
        .like-btn:active { transform: scale(0.95); }

        /* 评论区 */
        .comment-section { background: #fff; padding: 16px; }
        .comment-section h3 { font-size: 16px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
        .comment-item { margin-bottom: 2px; }
        .comment-body { padding: 10px 12px; border-radius: 6px; }
        .comment-body.level-1 { background: #fafafa; }
        .comment-body.level-2 { background: #f5f5f5; }
        .comment-body.level-3 { background: #f0f0f0; }
        .comment-username { color: #fb7299; font-weight: 600; font-size: 13px; margin-right: 6px; cursor: default; }
        .comment-text { font-size: 14px; line-height: 1.5; color: #18191c; }
        .comment-meta { display: flex; align-items: center; gap: 14px; margin-top: 6px; font-size: 12px; color: #9499a0; }
        .comment-like { cursor: pointer; display: flex; align-items: center; gap: 4px; transition: color 0.15s; background: none; border: none; font-size: 12px; color: #9499a0; padding: 2px 0; }
        .comment-like.liked { color: #fb7299; }
        .comment-like:hover { color: #fb7299; }
        .comment-reply-btn { cursor: pointer; background: none; border: none; font-size: 12px; color: #9499a0; padding: 2px 0; }
        .comment-reply-btn:hover { color: #fb7299; }
        .reply-indent { margin-left: 8px; padding-left: 14px; border-left: 2px solid #e3e5e7; }

        /* 底部输入栏 */
        .input-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e3e5e7; padding: 10px 16px; display: flex; gap: 10px; align-items: center; z-index: 10; }
        .input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #e3e5e7; border-radius: 20px; font-size: 14px; outline: none; background: #f4f5f7; transition: border-color 0.2s; }
        .input-bar input:focus { border-color: #fb7299; background: #fff; }
        .input-bar .reply-hint { font-size: 12px; color: #fb7299; margin-bottom: 4px; display: none; position: absolute; top: -22px; left: 16px; }
        .input-bar button { padding: 8px 16px; border-radius: 18px; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; }
        .input-bar .send-btn { background: #fb7299; color: #fff; }
        .input-bar .cancel-btn { background: #f4f5f7; color: #9499a0; }
        .input-bar button:active { transform: scale(0.95); }

        /* 空/加载/错误状态 */
        .state-box { text-align: center; padding: 60px 20px; color: #9499a0; }
        .state-box .icon { font-size: 48px; margin-bottom: 12px; }
        .state-box .msg { font-size: 14px; }
        .empty-comments { text-align: center; padding: 40px 20px; color: #9499a0; font-size: 14px; }

        /* toast */
        .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; z-index: 99; pointer-events: none; animation: fadeInOut 1.8s forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div class="top-bar">
    <a class="back" href="start.html">&#8592;</a>
    <span class="title" id="topTitle">详情</span>
</div>

<div class="main">
    <!-- 媒体区 -->
    <div class="media" id="mediaArea"></div>
    <!-- 图片画廊（图文类型） -->
    <div class="gallery" id="gallery" style="display:none"></div>

    <!-- 信息区 -->
    <div class="info">
        <div class="content-title" id="contentTitle"></div>
        <div class="stats"><span id="statLike">❤ 0</span><span id="statComment">💬 0</span></div>
        <div class="author-row">
            <div class="author-info" onclick="goSpace()">
                <div class="author-avatar" id="authorAvatar"></div>
                <span class="author-name" id="authorName"></span>
            </div>
            <button class="follow-btn unfollowed" id="followBtn" onclick="toggleFollow()">+ 关注</button>
        </div>
        <div class="actions">
            <button class="like-btn" id="likeBtn" onclick="toggleContentLike()">❤ 点赞 <span id="likeCount">0</span></button>
        </div>
        <div class="desc" id="contentDesc"></div>
    </div>

    <!-- 评论区 -->
    <div class="comment-section">
        <h3 id="commentHeader">评论</h3>
        <div id="commentList"></div>
    </div>
</div>

<!-- 底部输入栏 -->
<div class="input-bar" id="inputBar">
    <span class="reply-hint" id="replyHint"></span>
    <input type="text" id="commentInput" placeholder="发一条友善的评论" maxlength="500">
    <button class="cancel-btn" id="cancelReplyBtn" onclick="cancelReply()" style="display:none">取消</button>
    <button class="send-btn" onclick="sendComment()">发送</button>
</div>

<script>
// ==================== 状态 ====================
let contentData = null;
let comments = [];
let currentParentId = null;
const contentId = new URLSearchParams(window.location.search).get('contentId');
const token = localStorage.getItem('userToken');

// ==================== 初始化 ====================
if (!contentId) {
    showError('缺少内容ID');
} else {
    init();
}

async function init() {
    showLoading();
    try {
        await Promise.all([loadContent(), loadComments()]);
        renderAll();
    } catch (e) {
        if (e.status === 401 || e.status === 403) return;
        showError(e.msg || '加载失败，请刷新重试');
    }
}

// ==================== 数据加载 ====================
async function loadContent() {
    const data = await request(`./search/IdSearch?contentId=${contentId}`);
    console.log('[loadContent] 完整响应:', JSON.stringify(data, null, 2));
    contentData = data.data;
    console.log('[loadContent] contentData:', JSON.stringify(contentData, null, 2));
    console.log('[loadContent] type=' + contentData.type + ', videoUrl=' + contentData.videoUrl + ', coverUrl=' + contentData.coverUrl);
    document.getElementById('topTitle').textContent = contentData.title || '详情';
}

async function loadComments() {
    const data = await request(`./comment/show?contentId=${contentId}`);
    comments = data.data || [];
}

// ==================== 渲染 ====================
function renderAll() {
    renderMedia();
    renderInfo();
    renderComments();
}

function renderMedia() {
    const area = document.getElementById('mediaArea');
    const gallery = document.getElementById('gallery');
    area.innerHTML = '';
    gallery.style.display = 'none';
    gallery.innerHTML = '';

    console.log('[renderMedia] contentData.type=' + contentData.type + ', videoUrl=' + contentData.videoUrl + ', coverUrl=' + contentData.coverUrl);

    if (contentData.type === 1) {
        // 视频类型
        const video = document.createElement('video');
        video.src = contentData.videoUrl || '';
        video.controls = true;
        video.style.width = '100%';
        if (contentData.coverUrl) {
            video.poster = contentData.coverUrl;
        }
        console.log('[renderMedia] 创建video元素, src=' + video.src + ', poster=' + video.poster);
        video.addEventListener('loadedmetadata', () => console.log('[video] 元数据加载完成, 时长=' + video.duration + 's, 尺寸=' + video.videoWidth + 'x' + video.videoHeight));
        video.addEventListener('canplay', () => console.log('[video] 可以开始播放'));
        video.addEventListener('error', (e) => console.error('[video] 播放错误:', video.error));
        video.addEventListener('loadstart', () => console.log('[video] 开始加载 src=' + video.currentSrc));
        area.appendChild(video);

    } else {
        // 图文类型：显示封面
        if (contentData.coverUrl) {
            const img = document.createElement('img');
            img.src = contentData.coverUrl;
            img.className = 'cover';
            img.alt = contentData.title || '';
            area.appendChild(img);
        }
        // 图片列表
        if (contentData.imageUrls && contentData.imageUrls.length > 0) {
            gallery.style.display = 'flex';
            contentData.imageUrls.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.alt = '';
                gallery.appendChild(img);
            });
        }
    }
}

function renderInfo() {
    document.getElementById('contentTitle').textContent = contentData.title || '';
    document.getElementById('statLike').textContent = '❤ ' + (contentData.likeCount || 0);
    document.getElementById('statComment').textContent = '💬 ' + (contentData.commentCount || 0);
    document.getElementById('authorName').textContent = contentData.authorName || '未知作者';
    document.getElementById('contentDesc').textContent = contentData.description || '';

    // 头像首字
    const avatar = document.getElementById('authorAvatar');
    avatar.textContent = (contentData.authorName || '?').charAt(0);

    // 关注按钮
    updateFollowBtn();

    // 点赞按钮
    updateLikeBtn();
    document.getElementById('likeCount').textContent = contentData.likeCount || 0;
}

function updateFollowBtn() {
    const btn = document.getElementById('followBtn');
    if (contentData.isFollowed) {
        btn.textContent = '已关注';
        btn.className = 'follow-btn followed';
    } else {
        btn.textContent = '+ 关注';
        btn.className = 'follow-btn unfollowed';
    }
}

function updateLikeBtn() {
    const btn = document.getElementById('likeBtn');
    if (contentData.isLiked) {
        btn.className = 'like-btn liked';
    } else {
        btn.className = 'like-btn';
    }
}

function renderComments() {
    const container = document.getElementById('commentList');
    const header = document.getElementById('commentHeader');
    container.innerHTML = '';

    const count = countTotal(comments);
    header.textContent = '评论 (' + count + ')';

    if (!comments || comments.length === 0) {
        container.innerHTML = '<div class="empty-comments">暂无评论，快来抢沙发吧</div>';
        return;
    }

    comments.forEach(c => {
        container.appendChild(createCommentItem(c, 0));
    });
}

function countTotal(list) {
    let n = list.length;
    list.forEach(c => {
        if (c.children && c.children.length > 0) n += countChildren(c.children);
    });
    return n;
}

function countChildren(list) {
    let n = list.length;
    list.forEach(c => {
        if (c.children && c.children.length > 0) n += countChildren(c.children);
    });
    return n;
}

function createCommentItem(comment, level) {
    const wrapper = document.createElement('div');
    wrapper.className = 'comment-item';

    if (level > 0) {
        wrapper.className += ' reply-indent';
    }

    const body = document.createElement('div');
    body.className = 'comment-body';
    if (level > 0 && level <= 3) {
        body.className += ' level-' + level;
    }

    // 用户名
    const nameSpan = document.createElement('span');
    nameSpan.className = 'comment-username';
    nameSpan.textContent = comment.username || '匿名';

    // 内容
    const textSpan = document.createElement('span');
    textSpan.className = 'comment-text';
    textSpan.textContent = comment.content || '';

    // 元信息行
    const meta = document.createElement('div');
    meta.className = 'comment-meta';

    const likeBtn = document.createElement('button');
    likeBtn.className = 'comment-like' + (comment.isLiked ? ' liked' : '');
    likeBtn.innerHTML = '❤ ' + (comment.likeCount || 0);
    likeBtn.addEventListener('click', function () {
        toggleCommentLike(comment, likeBtn);
    });

    const replyBtn = document.createElement('button');
    replyBtn.className = 'comment-reply-btn';
    replyBtn.textContent = '回复';
    replyBtn.addEventListener('click', function () {
        setReply(comment);
    });

    meta.appendChild(likeBtn);
    meta.appendChild(replyBtn);

    body.appendChild(nameSpan);
    body.appendChild(textSpan);
    body.appendChild(meta);
    wrapper.appendChild(body);

    // 子评论
    if (comment.children && comment.children.length > 0) {
        comment.children.forEach(child => {
            wrapper.appendChild(createCommentItem(child, level + 1));
        });
    }

    return wrapper;
}

// ==================== 交互 ====================
function requireLogin() {
    if (!token) {
        showToast('请先登录');
        return false;
    }
    return true;
}

async function toggleContentLike() {
    if (!requireLogin()) return;

    const isLiked = contentData.isLiked;
    const action = isLiked ? 'remove' : 'add';

    // 乐观更新
    contentData.isLiked = !isLiked;
    contentData.likeCount += isLiked ? -1 : 1;
    updateLikeBtn();
    document.getElementById('likeCount').textContent = contentData.likeCount;
    document.getElementById('statLike').textContent = '❤ ' + contentData.likeCount;

    try {
        await request(`./like/content/${action}?contentId=${contentId}`, { method: 'POST' });
    } catch (e) {
        // 回滚
        contentData.isLiked = isLiked;
        contentData.likeCount += isLiked ? 1 : -1;
        updateLikeBtn();
        document.getElementById('likeCount').textContent = contentData.likeCount;
        document.getElementById('statLike').textContent = '❤ ' + contentData.likeCount;
        showToast(e.msg || '操作失败');
    }
}

async function toggleCommentLike(comment, btnElement) {
    if (!requireLogin()) return;

    const isLiked = comment.isLiked;
    const action = isLiked ? 'remove' : 'add';

    // 乐观更新
    comment.isLiked = !isLiked;
    comment.likeCount += isLiked ? -1 : 1;
    btnElement.className = 'comment-like' + (comment.isLiked ? ' liked' : '');
    btnElement.innerHTML = '❤ ' + comment.likeCount;

    try {
        await request(`./like/comment/${action}?commentId=${comment.commentId}`, { method: 'POST' });
    } catch (e) {
        comment.isLiked = isLiked;
        comment.likeCount += isLiked ? 1 : -1;
        btnElement.className = 'comment-like' + (comment.isLiked ? ' liked' : '');
        btnElement.innerHTML = '❤ ' + comment.likeCount;
        showToast(e.msg || '操作失败');
    }
}

async function toggleFollow() {
    if (!requireLogin()) return;

    const isFollowed = contentData.isFollowed;
    const action = isFollowed ? 'remove' : 'add';

    // 乐观更新
    contentData.isFollowed = !isFollowed;
    updateFollowBtn();

    try {
        await request(`./follow/${action}?followedUserId=${contentData.authorId}`, { method: 'POST' });
        showToast(isFollowed ? '已取消关注' : '关注成功');
    } catch (e) {
        contentData.isFollowed = isFollowed;
        updateFollowBtn();
        showToast(e.msg || '操作失败');
    }
}

function setReply(comment) {
    if (!requireLogin()) { return; }
    currentParentId = comment.commentId;
    const input = document.getElementById('commentInput');
    input.placeholder = '回复 @' + (comment.username || '匿名') + '：';
    input.focus();
    document.getElementById('replyHint').textContent = '回复 @' + (comment.username || '匿名');
    document.getElementById('replyHint').style.display = 'block';
    document.getElementById('cancelReplyBtn').style.display = 'inline-block';
}

function cancelReply() {
    currentParentId = null;
    const input = document.getElementById('commentInput');
    input.placeholder = '发一条友善的评论';
    input.value = '';
    document.getElementById('replyHint').style.display = 'none';
    document.getElementById('cancelReplyBtn').style.display = 'none';
}

async function sendComment() {
    if (!requireLogin()) return;

    const message = document.getElementById('commentInput').value.trim();
    if (!message) { showToast('评论内容不能为空'); return; }

    const body = { contentId: parseInt(contentId), message: message };
    if (currentParentId) {
        body.parentId = currentParentId;
    }

    try {
        await request('./comment/add', { method: 'POST', jsonBody: body });
        document.getElementById('commentInput').value = '';
        cancelReply();
        showToast('评论成功');
        await loadComments();
        renderComments();
    } catch (e) {
        showToast(e.msg || '评论失败');
    }
}

// ==================== 工具函数 ====================
async function request(url, options = {}) {
    options.headers = options.headers || {};

    if (options.jsonBody) {
        options.method = options.method || 'POST';
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(options.jsonBody);
    }

    if (token) {
        options.headers['token'] = token;
    }

    const res = await fetch(url, options);

    if (!res.ok) {
        if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('userToken');
            alert('登录已过期，请重新登录');
            window.location.href = 'login.html';
            throw { status: res.status, msg: 'Unauthorized' };
        }
    }

    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
        const data = await res.json();
        if (data.code !== 200) {
            throw { msg: data.msg, code: data.code };
        }
        return data;
    }
    return { code: 200, data: await res.text() };
}

function goSpace() {
    if (contentData && contentData.authorId) {
        window.location.href = 'space.html?userId=' + contentData.authorId;
    }
}

function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
}

function showLoading() {
    document.getElementById('mediaArea').innerHTML = '<div class="state-box"><div class="icon">⏳</div><div class="msg">加载中...</div></div>';
}

function showError(msg) {
    document.getElementById('mediaArea').innerHTML = '';
    document.getElementById('commentList').innerHTML = '<div class="state-box"><div class="icon">😞</div><div class="msg">' + msg + '</div></div>';
}

// 回车发送
document.getElementById('commentInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendComment();
    }
});
</script>

</body>
</html>
