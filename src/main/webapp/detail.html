    /**
     * 统一请求函数
     * @param url 请求地址
     * @param options 配置项 (method, body, headers 等)
     */
    // 统一请求：仅在有 body 时添加 Content-Type，自动带 token，处理 401/非 JSON
    async function request(url, options = {}) {
        const token = localStorage.getItem("userToken");
        options.headers = options.headers || {};

        if (options.body && !options.headers['Content-Type']) {
            options.headers['Content-Type'] = 'application/x-www-form-urlencoded';
        }
        if (token) {
            options.headers['token'] = token;
        }

        const res = await fetch(url, options);
        if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('userToken');
                alert('登录已过期，请重新登录');
                window.location.href = 'login.html';
                throw new Error('Unauthorized');
            }
            const ct = (res.headers.get('content-type') || '');
            if (ct.includes('application/json')) {
                const err = await res.json();
                throw err;
            }
            const txt = await res.text();
            throw {msg: txt, status: res.status};
        }

        const contentType = (res.headers.get('content-type') || '');
        if (contentType.includes('application/json')) {
            return res.json();
        }
        return {data: await res.text()};
    }

        let currentParentId = 0;
        let params = new URLSearchParams(window.location.search);
        let videoId = params.get("videoId");

        // 页面启动加载
    if (!videoId) {
        alert("未找到视频ID");
    } else {
        loadVideoDetail(videoId);
        loadComments(videoId);
    }

        // --- 1. 加载视频详情 ---
    async function loadVideoDetail(videoId) {
        const data = await request(`./video?action=IdSearch&videoId=${videoId}`);
                if (data && data.code === 200) {
                    let v = data.data;
                    const container = document.getElementById("video");
                    container.innerHTML = '';

                    const h3 = document.createElement('h3');
                    h3.textContent = v.title || '';

                    const meta = document.createElement('p');
                    meta.textContent = `ID: ${v.id} | 作者: ${v.authorName || ''}`;

                    const desc = document.createElement('p');
                    desc.textContent = v.description || '';

                    const a = document.createElement('a');
                    a.href = v.videoUrl || '#';
                    a.target = '_blank';
                    a.textContent = '▶ 点击打开视频（新标签）';

                    container.appendChild(h3);
                    container.appendChild(meta);
                    container.appendChild(desc);
                    container.appendChild(a);
                } else {
                    document.getElementById("video").innerText = data ? data.msg : "加载失败";
                }
    }

        // --- 2. 加载评论列表 ---
    async function loadComments(videoId) {
        const data = await request(`./comment?action=show`, {
            method: 'POST',
            body: `videoId=${videoId}`
        });

        if (data && data.code === 200) {
            renderComments(data.data);
        }
    }

        // --- 3. 发表评论 ---
    async function sendComment() {
        let content = document.getElementById("content").value.trim();
        if (!content) { alert("内容不能为空"); return; }

        const data = await request(`./comment?action=add`, {
            method: "POST",
            body: `videoId=${videoId}&content=${encodeURIComponent(content)}&parentId=${currentParentId}`
        });

        if (data && data.code === 200) {
            alert("发表成功");
            resetCommentInput();
            loadComments(videoId); // 刷新列表
        } else {
            alert("发表失败: " + (data ? data.msg : '未知错误'));
        }
    }

        // --- 辅助函数：渲染评论 ---
        function renderComments(comments) {
        let div = document.getElementById("commentList");
        div.innerHTML = "";
        if (!comments || comments.length === 0) {
        div.innerText = "暂无评论";
        return;
    }
        comments.forEach(c => {
        div.appendChild(createCommentItem(c, 0));
    });
    }

        function createCommentItem(comment, level) {
        let div = document.createElement("div");
        div.className = "comment-item";
        div.style.marginLeft = (level * 20) + "px";
        div.style.borderBottom = "1px solid #eee";
        div.style.padding = "10px 5px";

        const row = document.createElement('div');
        const name = document.createElement('b');
        name.style.color = 'blue';
        name.textContent = comment.username || '匿名';

        const text = document.createTextNode(': ' + (comment.content || ''));

        const replyBtn = document.createElement('button');
        replyBtn.style.fontSize = '12px';
        replyBtn.textContent = '回复';
        replyBtn.addEventListener('click', function () {
            reply(comment.commentId, comment.username);
        });

        row.appendChild(name);
        row.appendChild(text);
        row.appendChild(document.createTextNode(' '));
        row.appendChild(replyBtn);

        div.appendChild(row);

        if (comment.children && comment.children.length > 0) {
            comment.children.forEach(child => {
                div.appendChild(createCommentItem(child, level + 1));
            });
        }
        return div;
    }

        function reply(commentId, userName) {
        currentParentId = commentId;
        const input = document.getElementById("content");
        input.placeholder = "回复 @" + userName + "：";
        input.focus();
    }

        function resetCommentInput() {
        currentParentId = 0;
        document.getElementById("content").value = "";
        document.getElementById("content").placeholder = "输入评论";
    }

        function cancelReply() {
        resetCommentInput();
    }

    function goHome() {
        window.location.href = "start.html";
    }
