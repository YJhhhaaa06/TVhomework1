<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #18191c; min-height: 100vh; }

        .container { max-width: 360px; margin: 60px auto 0; padding: 0 20px; }

        /* logo */
        .logo-area { text-align: center; margin-bottom: 24px; }
        .logo-area .logo { font-size: 32px; font-weight: 700; color: #fb7299; }

        /* tab 切换 */
        .tab-row { display: flex; margin-bottom: 20px; border-bottom: 1px solid #e3e5e7; }
        .tab { flex: 1; text-align: center; padding: 12px 0; font-size: 15px; cursor: pointer; color: #9499a0; border-bottom: 2px solid transparent; transition: all 0.15s; background: none; border-top: none; border-left: none; border-right: none; }
        .tab.active { color: #fb7299; border-bottom-color: #fb7299; font-weight: 600; }

        /* 表单 */
        .form { background: #fff; padding: 24px 20px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 16px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #e3e5e7; border-radius: 8px; font-size: 14px; outline: none; background: #f9f9f9; transition: border-color 0.2s, background 0.2s; }
        .form-group input:focus { border-color: #fb7299; background: #fff; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; background: #fb7299; color: #fff; transition: all 0.15s; margin-top: 4px; }
        .btn:active { transform: scale(0.97); opacity: 0.85; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        .home-link { display: block; text-align: center; margin-top: 20px; color: #9499a0; font-size: 13px; text-decoration: none; }
        .home-link:hover { color: #fb7299; }

        .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; z-index: 99; pointer-events: none; animation: fadeInOut 2s forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 15% { opacity: 1; transform: translateX(-50%) translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-area"><span class="logo">🐧 视频平台</span></div>

    <div class="tab-row">
        <button class="tab active" id="loginTab" onclick="switchTab('login')">登录</button>
        <button class="tab" id="regTab" onclick="switchTab('register')">注册</button>
    </div>

    <!-- 登录表单 -->
    <div class="form" id="loginForm">
        <div class="form-group">
            <input type="text" id="loginAccount" placeholder="手机号 或 用户ID" autocomplete="username">
        </div>
        <div class="form-group">
            <input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn" onclick="doLogin()">登录</button>
    </div>

    <!-- 注册表单 -->
    <div class="form" id="regForm" style="display:none">
        <div class="form-group">
            <input type="text" id="regUsername" placeholder="用户名" autocomplete="off">
        </div>
        <div class="form-group">
            <input type="text" id="regPhone" placeholder="手机号" autocomplete="off">
        </div>
        <div class="form-group">
            <input type="password" id="regPwd" placeholder="密码（至少6位）" autocomplete="new-password">
        </div>
        <div class="form-group">
            <input type="password" id="regConfirmPwd" placeholder="确认密码" autocomplete="new-password">
        </div>
        <button class="btn" id="regBtn" onclick="doRegister()">注册</button>
    </div>

    <a class="home-link" href="start.html">← 返回首页</a>
</div>

<script>
// ==================== Tab 切换 ====================
function switchTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
    document.getElementById('regForm').style.display = isLogin ? 'none' : '';
    document.getElementById('loginTab').classList.toggle('active', isLogin);
    document.getElementById('regTab').classList.toggle('active', !isLogin);
}

// ==================== 登录 ====================
async function doLogin() {
    const account = document.getElementById('loginAccount').value.trim();
    const password = document.getElementById('loginPwd').value;

    if (!account || !password) {
        showToast('账号和密码不能为空');
        return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
        const res = await fetch('./user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account, password })
        });
        const data = await res.json();

        if (data.code === 200 && data.data) {
            localStorage.setItem('userToken', data.data.token);
            localStorage.setItem('username', data.data.username);
            window.location.href = 'start.html';
        } else {
            showToast(data.msg || '登录失败');
        }
    } catch (e) {
        showToast('网络错误，请重试');
    } finally {
        btn.disabled = false;
        btn.textContent = '登录';
    }
}

// ==================== 注册 ====================
async function doRegister() {
    const username = document.getElementById('regUsername').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const password = document.getElementById('regPwd').value;
    const confirm = document.getElementById('regConfirmPwd').value;

    // 前端校验
    if (!username || !phone || !password || !confirm) {
        showToast('所有字段都必须填写');
        return;
    }
    if (!/^1[3-9]\d{9}$/.test(phone)) {
        showToast('请输入有效的11位手机号');
        return;
    }
    if (password.length < 6) {
        showToast('密码长度不能少于6位');
        return;
    }
    if (password !== confirm) {
        showToast('两次输入的密码不一致');
        return;
    }

    const btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.textContent = '注册中...';

    try {
        const res = await fetch('./user/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, phone, password })
        });
        const data = await res.json();

        if (data.code === 200 && data.data) {
            localStorage.setItem('userToken', data.data.token);
            localStorage.setItem('username', data.data.username);
            window.location.href = 'start.html';
        } else {
            showToast(data.msg || '注册失败');
        }
    } catch (e) {
        showToast('网络错误，请重试');
    } finally {
        btn.disabled = false;
        btn.textContent = '注册';
    }
}

// ==================== 工具 ====================
function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
}

// 回车触发
document.getElementById('loginAccount').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('regUsername').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
document.getElementById('regPhone').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
document.getElementById('regPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
document.getElementById('regConfirmPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
</script>

</body>
</html>
