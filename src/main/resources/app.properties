# ===== 数据库配置 =====
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/TVDatabase?useSSL=false&serverTimezone=Asia/Shanghai
db.username=root
db.password=MySQL
db.pool.initSize=5
db.pool.maxSize=20
db.pool.timeoutMs=5000

# ===== Redis 配置 =====
redis.host=localhost
redis.port=6379
redis.maxTotal=50
redis.maxIdle=10
redis.minIdle=5
# 超时与熔断（T1 cache-01：治 U-10 未配置超时 / N1 逐请求等连接超时）：
#   connect/so 超时 1s——本地单实例正常往返 ms 级，1s 已远超够用，封顶单请求最坏等待；
#   maxWait 1s——池耗尽时 borrow 最多等 1s（默认 -1 为无限阻塞）；
#   熔断：连续 5 次 Redis 访问失败即开启，缓存请求快速失败（立即降级走 DB），
#         冷却 10s 后放行单个探针请求，探针成功自动恢复正常缓存路径
redis.connectTimeoutMs=1000
redis.soTimeoutMs=1000
redis.pool.maxWaitMs=1000
redis.breaker.failureThreshold=5
redis.breaker.cooldownMillis=10000

# ===== RabbitMQ 配置（T16 feed1-16：feed 推拉结合一期，唯一依赖例外 amqp-client）=====
# 本机容器约定：rabbitmq / 宿主端口 5672（AMQP）+ 15672（management），账密为容器创建时指定值。
# 覆盖链沿用 AppConfig 统一机制（rabbitmq.host -> RABBITMQ_HOST；-Drabbitmq.host 亦可）。
# MQ 为可降级外部依赖（不可用不得阻断启动，降级语义由 T17 落地），故 getter 统一带默认值读取。
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=admin
rabbitmq.password=admin123
rabbitmq.vhost=/
# T17：连接/握手超时（毫秒）——封顶"broker 不可用"时的启动与请求阻塞（默认 60s 会阻塞 Tomcat 启动线程）。
rabbitmq.connection.timeoutMs=2000

# ===== JWT 配置 =====
jwt.secret=STONE
jwt.expireHours=2

# ===== 文件上传配置 =====
upload.path=D:/data/projects/VideoPlatform/stone
upload.maxSize=104857600

# ===== 缓存配置 =====
# 定时全量刷新配置 cache.content.refreshMinutes 已随旧 ContentCacheManager（T6 移除）删除，
# 缓存一致性由 Cache-Aside 自愈 + 业务显式失效 + 启动/懒索引重建承担
# 分域 TTL（T9 拍板值，依据双轮 CacheStats 压测观测 + 各域读写特性，详见 NEEDS 4.14 T9 执行定稿）：
#   content 30min（热读域：启动全量重建后恒 100% hitData + 滑动续期后热点常驻，miss≈0 无穿透风险）；
#   comment 10min（命中 38%~42%，新鲜度敏感：评论增删/点赞失效驱动，保持短 TTL 最安全）；
#   like    15min（命中 59.0%~64.8% 且显式失效清晰（点赞/取消失效 count+set），适度延长降重建成本）；
#   follow  30min（关系低频变 + MULTI 双写失效清晰；压测以空关系为主，依据写路径特性保守延长）
cache.content.ttlMinutes=30
cache.comment.ttlMinutes=10
cache.like.ttlMinutes=15
cache.follow.ttlMinutes=30
# 索引懒重建失败冷却退避（T5 cache-05，治 N1：Redis 停机期间每 /start 逐请求触发 DB 全量重建）：
#   重建失败后进入冷却窗口，窗口内跳过重建（停机期间从"每请求 1 次全表查询"收敛到"每冷却窗口 1 次"）；
#   冷却过期后下一请求自然重试，重建成功即恢复正常。对齐熔断冷却先例 redis.breaker.cooldownMillis。
cache.content.indexRebuildCooldownMillis=10000

# ===== 写扩散收件箱（feed1-18 T18）=====
# feed:inbox:{userId} 单条时间线的 TTL（分钟）——口径 = **整条收件箱**的活跃期（不是单条内容），
# fanout 写入与（二期）读命中均滑动续期；到期等价于"该用户关注的人近期未发 + 本人未读" → 整条回收。
# 一期影子期无人读它，取值偏保守（长于单条内容缓存 30min）；键缺失时 AppConfig 取默认 60，不 fail-fast。
feed.inbox.ttlMinutes=60

# ===== feed 二期窗口重算（feed2-22 T22）=====
# 收件箱重建口径（NEEDS 4.0 机制拍板）= 每关注作者最近 K 条 → 归并去重 → contentId 降序 → 裁剪到 C。
# K/C 均为"有界窗口"参数：T19 的"全量重算"（内存 ∝ 关注规模 × 内容量）由此改为内存 ∝ 关注数 × K。
# 键缺失时 AppConfig 取默认 20 / 200，不 fail-fast（偏离散取值口径）；阈值机制 / 活跃策略属三期。
# 覆盖链沿用 AppConfig（feed.inbox.windowPerAuthor -> FEED_INBOX_WINDOWPERAUTHOR；
#                     feed.inbox.windowMax       -> FEED_INBOX_WINDOWMAX）。
feed.inbox.windowPerAuthor=20
feed.inbox.windowMax=200

# ===== feed 二期大V占位路由（feed2-21 T21）=====
# 大V判定 = 名单命中（feed.bigv.userIds，逗号分隔用户 id）OR 粉丝数 >= feed.bigv.threshold；
# 判定单点 = feed.service.FeedBigVRouter（fanout / 重建 / 读三处同源；本期仅接线 fanout）。
# **占位机制**：固定阈值 + 静态名单——阈值波动 / 掉粉补推 / 名单维护归三期（NEEDS 4.0）。
# 覆盖链沿用 AppConfig（feed.bigv.threshold -> FEED_BIGV_THRESHOLD；feed.bigv.userIds -> FEED_BIGV_USERIDS）。
feed.bigv.threshold=10000
feed.bigv.userIds=

# ===== feed 二期读侧两路归并（feed2-23 T23）=====
# 三个"窗口"概念分立、不得互用（NEEDS 4.0 对齐补录）：
#   ① 收件箱容量 C = feed.inbox.windowMax（200，表侧：重建写入 feed_inbox 的每用户行数上限；本段不动）
#   ② 单响应信封   = FeedController.FEED_PAGE_SIZE_*（100，接口侧：一次 HTTP 返回条数；不动）
#   ③ 读侧总窗口 M = feed.readWindowMax（300，读侧：两路读归并去重降序后的可见上限 = 深翻边界）
# 关系：信封 ≤ M（100 → 3 页）；C 与 M 各自独立（改 C 会改表侧重建量与成本，故不复用同一键）。
# 兜底：MQ 不可用 / 未同步（无 feed_inbox_sync 行）→ 回退既有纯拉（唯一入口 FeedService）。
# 键缺失时 AppConfig 取默认 300 / 20 / 60，不 fail-fast（同 feed.inbox.* 的容错口径）。
# 覆盖链沿用 AppConfig（feed.readWindowMax    -> FEED_READWINDOWMAX；
#                     feed.outbox.windowSize -> FEED_OUTBOX_WINDOWSIZE；
#                     feed.outbox.ttlMinutes -> FEED_OUTBOX_TTLMINUTES）。
feed.readWindowMax=300

# 大V发件箱（读时拉、**不落表**）：每作者最近 N 条 contentId（走 content.idx_user_id 物理 (user_id,id)
# 反向索引扫描）；N 独立于重建的 feed.inbox.windowPerAuthor K（两者服务不同层，不复用同一键）。
feed.outbox.windowSize=20

# feed:outbox:{authorId} 读缓存 TTL（分钟）—— 只作缓存淘汰、无正确性含义（真相源 = content 表）；
# 写后失效由既有 push 消费者负责（1 发布 = 1 DEL），故本 TTL 与 feed.inbox.ttlMinutes 同为"保底回收"。
feed.outbox.ttlMinutes=60

# ===== 日志配置 =====
# 输出端（T1 log-01，D9"可扩展多输出端"）：文件名一律来自配置，LogUtil 按"输出端规格表"装配
# Handler——新增输出端只需加一项规格 + 一个配置键，持有 LOGGER 的业务类零改动
# （T8 log2-08 的审计输出端即该底座的首个实践：见下方 log.audit.file）。
# 目录口径：log.file 所在目录 = 日志目录；其余输出端的相对路径只取文件名、落同一目录，
#           故注入 LOG_PATH（tools/run_tests.py、pom.xml surefire）一处即可让所有日志文件换目录。
# 环境变量覆盖沿用 AppConfig 统一机制（log.error.file -> LOG_ERROR_FILE），log.file 另有 LOG_PATH 别名。
log.level=INFO
log.file=logs/system.log
# 错误输出端：只收 level >= log.error.level 的记录（默认 SEVERE），独立文件便于排障速览
log.error.file=error.log
log.error.level=SEVERE
# 按大小轮转（JUL FileHandler 原生 limit/count）：生成文件为 <文件>.<N>，N=0 为当前写入文件、
# N 越大越旧，超出 fileCount 的最旧文件被删除；maxBytes<=0 视为不轮转（文件名精确等于配置值）
log.maxBytes=10485760
log.fileCount=5
# 访问输出端（T3 log-03）：每请求一行（method/path/userId/结果码/耗时/慢标记），由最外层
# filter AccessLogFilter 写入专属 logger "access"（LogUtil.getAccessLogger）——行只落 access.log，
# 不进 system.log；阈值固定 INFO。相对路径只取文件名、落 log.file 同目录。
log.access.file=access.log
# 慢请求阈值（毫秒）：访问日志行 cost >= 此值 时带 slow=1 标记（默认 1000 = 1s）
log.slowRequestMs=1000
# 审计输出端（T8 log2-08）：管理端 4 个写操作 + 用户侧 3 个敏感变更的**成功路径**留痕，
# 由 util/AuditLog 写入专属 logger "audit"（LogUtil.getAuditLogger）——行只落 audit.log，
# 不进 system.log；阈值固定 INFO（**不受 log.level 影响**，审计不得被运维开关静默）。
# 轮转沿用 log.maxBytes / log.fileCount（审计记录稀疏，同容量已远超需求）。
# 相对路径只取文件名、落 log.file 同目录（LOG_PATH 一处换目录的口径自动覆盖本端）。
log.audit.file=audit.log

# ===== IoC 配置 =====
# @Inject 字段在容器中取不到 Bean 的处理（T17，N12 前半）：
#   true=注入点即抛错 fail-fast（Bean 在启动注入失败=启动失败；Controller 在首请求 servlet init 失败）；
#   false=仅逐条 WARNING + 未注入清单汇总（可观测、不中断启动）
ioc.failFast=true
